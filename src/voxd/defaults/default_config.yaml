log_enabled: true
log_location: ''
perf_collect: false
perf_accuracy_rating_collect: true
typing: true
typing_delay: 1
typing_start_delay: 0.15
ctrl_v_paste: false  # Use Ctrl+V instead of default Ctrl+Shift+V
append_trailing_space: true
verbosity: false
autostart: false
record_chunked: true
record_chunk_seconds: 300
audio_preproc_enabled: true
audio_peak_dbfs: -3.0
audio_clip_warn_threshold: 0.01
# Audio device preferences
audio_prefer_pulse: true
audio_input_device: ""
# Mic autoset (best-effort; uses wpctl/pactl/amixer if present)
mic_autoset_enabled: true
mic_autoset_level: 0.45
# Speech-recognition engine: "whisper" (whisper-cli) or "parakeet" (parakeet-cli
# from the same whisper.cpp build, NVIDIA parakeet-tdt-0.6b-v3: 25 European
# languages incl. Russian, auto-detected; much faster, less VRAM, usable on CPU).
# Switch with: voxd-model use parakeet-tdt-0.6b-v3   (or any whisper model key).
asr_engine: whisper
# Empty → auto-detect parakeet-cli / model (whisper.cpp/build/bin, ~/.local/share/voxd/models).
parakeet_binary: ""
parakeet_model_path: ""
whisper_binary: whisper.cpp/build/bin/whisper-cli
whisper_model_path: whisper.cpp/models/ggml-base.en.bin
language: en
# Use the GPU when whisper-cli was built with a GPU backend (CUDA/Vulkan).
# A CPU-only binary ignores this; set false to force CPU (-ng) on a GPU build.
whisper_gpu_enabled: true
# Which GPU to use when several drivers are present (integrated iGPU + discrete
# NVIDIA on a Vulkan build). voxd restricts the Vulkan loader to the chosen
# driver (VK_DRIVER_FILES). "auto" picks the discrete NVIDIA driver; or set
# "nvidia" / "amd" / "intel" to force a vendor. Only affects Vulkan builds.
whisper_gpu_device: auto
# Just before each transcription, check free VRAM (nvidia-smi) and go straight
# to CPU when the model clearly cannot fit — avoids a doomed GPU attempt when a
# long desktop session has exhausted VRAM. No effect without nvidia-smi.
whisper_vram_check: true
# Pass -fa (flash attention) to whisper-cli: faster, smaller compute buffers
# (helps VRAM-tight cards). Auto-disabled if the binary rejects the flag.
whisper_flash_attn: false

# Drop transcripts that consist solely of a known Whisper hallucination
# (e.g. the "subscribe to my channel" phrases produced on silence/noise).
hallucination_filter_enabled: true
hallucination_blocklist:
  - "Подписывайтесь на мой канал, ставьте лайки и пишите комментарии."
  - "Подписывайтесь на канал."
  - "Спасибо за просмотр!"
  - "Продолжение следует..."
  - "Субтитры сделал DimaTorzok"
  - "Субтитры создавал DimaTorzok"
  - "Редактор субтитров А.Семкин Корректор А.Егорова"
  - "Thanks for watching!"
  - "Please subscribe to my channel."
  - "Like and subscribe."

# --- Flux (VAD-driven continuous dictation) ---------------------------------
flux_min_silence_ms: 500     # pause to finalize an utterance
flux_min_speech_ms: 200      # minimum speech before opening a segment
flux_pre_roll_ms: 180        # prepend audio before detection
# Flux VAD (single backend)
flux_energy_start_margin_db: 6.0
flux_energy_keep_margin_db: 3.0
flux_energy_abs_start_db: -33.0
flux_energy_abs_keep_db: -37.0
flux_energy_use_absolute: false
flux_energy_start_p: 0.55
flux_energy_keep_p: 0.50
# Legacy hysteresis thresholds (unused, kept for compatibility)
flux_start_threshold: 0.6
flux_end_threshold: 0.4
flux_post_roll_ms: 150
flux_min_segment_ms: 600
flux_cooldown_ms: 250
flux_min_rms_dbfs: -45.0

# Monitor and calibration
flux_monitor_enabled: true
flux_monitor_energy_window_s: 10
flux_monitor_spectrum_floor_db: -85.0
flux_calibration_sec: 5
flux_noise_ema: 0.05
flux_noise_spec_ema: 0.02
flux_noise_subtract_enabled: true

# --- ✨ AIPP (AI post-processing) ------------------------------------------
aipp_enabled: false
aipp_provider: llamacpp_server  # ollama / openai / openrouter / anthropic / xai / gigachat / llamacpp_server / openai_compatible
aipp_active_prompt: default

# List of models per provider
aipp_models:
  llamacpp_server: ["qwen2.5-3b-instruct-q4_k_m"]
  ollama: ["llama3.2:latest", "mistral:latest", "gemma3:latest", "qwen2.5-coder:1.5b"]
  openai: ["gpt-4o-mini-2024-07-18"]
  openrouter: ["openai/gpt-4o-mini", "anthropic/claude-3.5-sonnet", "meta-llama/llama-3.1-8b-instruct"]
  anthropic: ["claude-3-opus-20240229", "claude-3-haiku"]
  xai: ["grok-3-latest"]
  gigachat: ["GigaChat-2-Max", "GigaChat-2-Pro", "GigaChat-2", "GigaChat"]
  openai_compatible: ["custom-model"]

# Selected model per provider
aipp_selected_models:
  llamacpp_server: "qwen2.5-3b-instruct-q4_k_m"
  ollama: "llama3.2:latest"
  openai: "gpt-4o-mini-2024-07-18"
  openrouter: "openai/gpt-4o-mini"
  anthropic: "claude-3-opus-20240229"
  xai: "grok-3-latest"
  gigachat: "GigaChat-2-Max"
  openai_compatible: "custom-model"

aipp_openai_compatible_base_url: ""
aipp_openai_compatible_api_key: ""
# Proxy for requests to cloud AIPP providers (not used for local ones):
#   http://host:port, socks5://host:port, socks5://user:password@host:port
aipp_proxy: ""

# GigaChat (Sber) settings
gigachat_scope: GIGACHAT_API_PERS    # or GIGACHAT_API_CORP
gigachat_verify_ssl: true            # set false if Russian Trusted Root CA is missing

# llama.cpp settings
llamacpp_server_path: "llama.cpp/build/bin/llama-server"
llamacpp_cli_path: "llama.cpp/build/bin/llama-cli"
llamacpp_default_model: "llamacpp_models/qwen2.5-3b-instruct-q4_k_m.gguf"
llamacpp_server_url: "http://localhost:8080"
llamacpp_server_timeout: 30


aipp_prompts:
  default: "Rewrite the following input so that it is clean and concise. Do not add any additional text or commentary. Just the rewritten text."
  prompt1: "Interpret the following text to the best of your ability as a C programming language code and output it as such. Do not add any additional text or commentary. Just the corresponding C code."
  prompt2: "Interpret the following text to the best of your ability as a Python programming language code and output it as such. Do not add any additional text or commentary. Just the corresponding Python code."
  prompt3: "Rewrite the following text as a three-verse poem."